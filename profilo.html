<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profilo | Consegna24</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="shell">
    <a class="brand" href="/"><span class="logo">h24</span>Consegna24</a>
    <nav class="nav">
      <a href="/">Nuova consegna</a>
      <a id="adminLink" class="primary" href="/admin.html" style="display:none">Admin</a>
      <button class="btn primary" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="shell">
    <div class="pageHead">
      <div>
        <h1 class="pageTitle">Il tuo profilo</h1>
        <p class="muted" id="userEmail"></p>
      </div>
    </div>

    <section class="periodFilter" aria-labelledby="periodTitle">
      <div class="periodFilterHead">
        <div>
          <h2 id="periodTitle">Periodo</h2>
          <p class="muted">Scegli le date per aggiornare totali e storico consegne.</p>
        </div>
        <button class="btn ghost" type="button" id="currentMonthBtn">Mese corrente</button>
      </div>
      <div class="dateFilterGrid">
        <div class="field dateField">
          <label for="dateFrom">Dal</label>
          <input id="dateFrom" type="date">
        </div>
        <div class="field dateField">
          <label for="dateTo">Al</label>
          <input id="dateTo" type="date">
        </div>
        <button class="btn yellow filterBtn" type="button" id="applyFilterBtn">Applica filtro</button>
      </div>
      <p class="periodSummary" id="periodSummary"></p>
    </section>

    <div class="stats">
      <div class="stat">
        <span>Consegne nel periodo</span>
        <strong id="countAll">—</strong>
      </div>
      <div class="stat">
        <span>Consegne pagate</span>
        <strong id="countPaid">—</strong>
      </div>
      <div class="stat featuredStat">
        <span>Totale ordini</span>
        <strong id="spent">—</strong>
      </div>
    </div>

    <div class="ordersSectionHead">
      <div>
        <h2>Storico consegne</h2>
        <p class="muted" id="ordersRangeLabel"></p>
      </div>
      <strong class="resultsCount" id="resultsCount"></strong>
    </div>
    <div id="orders" class="ordersGrid"><div class="card empty">Caricamento...</div></div>
  </div>
</main>

<div class="modalLayer" id="clientEditModal" aria-hidden="true">
  <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="clientEditTitle">
    <div class="modalHead">
      <div>
        <h2 id="clientEditTitle" style="margin:0">Modifica consegna</h2>
        <p class="muted" style="margin:6px 0 0">Puoi aggiornare nomi, note, data e orario della consegna.</p>
      </div>
      <button class="x" type="button" id="closeClientEditModal" aria-label="Chiudi">×</button>
    </div>
    <form class="modalBody" id="clientEditForm">
      <div class="grid2">
        <div class="field">
          <label for="clientEditSenderName">Nome e cognome mittente</label>
          <input id="clientEditSenderName" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="clientEditReceiverName">Nome e cognome destinatario</label>
          <input id="clientEditReceiverName" autocomplete="name" required>
        </div>
        <div class="field full">
          <label for="clientEditDate">Data della consegna</label>
          <input id="clientEditDate" type="date" required>
        </div>
        <div class="field">
          <label for="clientEditTimeFrom">Dalle</label>
          <input id="clientEditTimeFrom" type="time" required>
        </div>
        <div class="field">
          <label for="clientEditTimeTo">Alle</label>
          <input id="clientEditTimeTo" type="time" required>
        </div>
        <div class="field full">
          <label for="clientEditNotes">Note</label>
          <textarea id="clientEditNotes" placeholder="Note sulla consegna"></textarea>
        </div>
      </div>
      <p id="clientEditStatus"></p>
      <div class="orderActions">
        <button class="btn yellow" type="submit" id="saveClientEditBtn">Salva modifiche</button>
        <button class="btn ghost" type="button" id="cancelClientEditBtn">Annulla</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
